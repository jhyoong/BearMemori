[project]
name = "bearmemori"
version = "0.3.9"
description = "Personal memory store with LLM processing"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "python-telegram-bot>=21",
    "python-multipart>=0.0.18",
    "jinja2>=3.1",
    "openai>=1.60",
    "pydantic-settings>=2.7",
    "chromadb>=0.6",
    "sentence-transformers>=3.0",
    "python-dateutil>=2.9",
    "mcp>=1.0",
]

[project.scripts]
bearmemori = "bearmemori.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.9",
]
