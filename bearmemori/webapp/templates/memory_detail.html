{% extends "base.html" %}
{% block title %}{{ memory.title }} - BearMemori{% endblock %}
{% block content %}
<h2>Edit Memory</h2>

<form method="post" action="/webapp/memories/{{ memory.id }}">
    <label for="title">Title</label>
    <input type="text" id="title" name="title" value="{{ memory.title }}" required>

    <label for="category">Category</label>
    <select id="category" name="category">
        {% for cat in categories %}
        <option value="{{ cat }}" {% if memory.category == cat %}selected{% endif %}>{{ cat }}</option>
        {% endfor %}
    </select>

    <label for="content">Content</label>
    <textarea id="content" name="content" rows="6" required>{{ memory.content }}</textarea>

    <label for="tags">Tags (comma-separated)</label>
    <input type="text" id="tags" name="tags" value="{{ memory.tags | join(', ') }}">

    <label>
        <input type="checkbox" name="needs_review" {% if memory.needs_review %}checked{% endif %}>
        Needs Review
    </label>

    <fieldset id="event-fields" {% if not memory.event_fields and memory.category.value not in ['event', 'task', 'reminder'] %}style="display:none"{% endif %}>
        <legend>Event / Reminder Fields</legend>

        <label for="event_datetime">Date &amp; Time</label>
        <input type="text" id="event_datetime" name="event_datetime"
               value="{{ memory.event_fields.datetime if memory.event_fields else '' }}"
               placeholder="e.g., 2026-03-25T14:30:00">

        <label for="event_status">Status</label>
        <select id="event_status" name="event_status">
            <option value="pending" {% if memory.event_fields and memory.event_fields.status == 'pending' %}selected{% endif %}>pending</option>
            <option value="done" {% if memory.event_fields and memory.event_fields.status == 'done' %}selected{% endif %}>done</option>
        </select>

        <label for="event_recurrence">Recurrence</label>
        <input type="text" id="event_recurrence" name="event_recurrence"
               value="{{ memory.event_fields.recurrence or '' if memory.event_fields else '' }}"
               placeholder="e.g., every 8 hours, daily, weekly">
    </fieldset>

    <div class="grid">
        <button type="submit">Save Changes</button>
        <button type="button" class="secondary" hx-delete="/webapp/memories/{{ memory.id }}" hx-confirm="Delete this memory permanently?">Delete</button>
    </div>
</form>

<p><a href="/webapp/memories">Back to list</a></p>
{% endblock %}
